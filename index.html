<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Catálogo · AudioVisuales PAPITO-PC</title>

<!-- Vista previa al compartir el link (WhatsApp, etc.) -->
<meta property="og:type" content="website">
<meta property="og:title" content="AudioVisuales PAPITO-PC — Catálogo">
<meta property="og:description" content="Películas, series, novelas, doramas, animes y animados. Pide por WhatsApp con un toque.">
<meta property="og:image" content="https://catalellafernandez86-bot.github.io/papito-catalogo/og-image.png">
<meta property="og:url" content="https://catalellafernandez86-bot.github.io/papito-catalogo/">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Catálogo de AudioVisuales PAPITO-PC: películas, series, novelas, doramas, animes y animados.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#0c0c12; --bg-elev:#15151f; --card:#1a1a26;
    --border: rgba(255,255,255,.08);
    --accent:#e3b73f; --accent-strong:#c99420; --accent-ink:#241a03; --accent-soft: rgba(227,183,63,.12);
    --text:#f4f1ea; --muted:#948f9c;
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:radial-gradient(1200px 400px at 50% -10%, rgba(227,183,63,.06), transparent 60%), var(--bg);
    color:var(--text); font-family:'Inter',-apple-system,Roboto,Segoe UI,Helvetica,Arial,sans-serif;
    line-height:1.45; padding-bottom:40px; min-height:100vh;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 16px 16px 16px;}

  header.top{display:flex; align-items:center; gap:11px; padding:22px 16px 14px 16px; max-width:640px; margin:0 auto;}
  .brand-mark{
    width:44px; height:44px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(155deg, var(--accent), var(--accent-strong));
    display:flex; align-items:center; justify-content:center; font-size:1.35rem;
    box-shadow:0 4px 16px rgba(227,183,63,.25);
  }
  h1{font-family:'Bebas Neue',Georgia,serif; font-size:1.6rem; margin:0; letter-spacing:1.2px;}
  header.top p{margin:2px 0 0 0; font-size:.75rem; color:var(--muted);}

  .toolbar{position:sticky; top:0; background:var(--bg); padding:10px 0 12px 0; z-index:5;}
  input[type=text], select{
    width:100%; background:var(--card); color:var(--text); border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:12px 13px; font-size:.95rem; font-family:inherit;
  }
  input:focus, select:focus{outline:none; border-color:var(--accent);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:10px 0 2px 0; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:8px 14px; border-radius:30px; font-size:.82rem; font-weight:600;
    background:var(--card); border:1px solid var(--border); color:var(--muted); cursor:pointer;
  }
  .chip.active{background:var(--accent-soft); color:var(--accent); border-color:rgba(227,183,63,.4);}

  .grid{display:grid; grid-template-columns:1fr; gap:12px; margin-top:8px;}
  @media (min-width:520px){ .grid{grid-template-columns:1fr 1fr;} }

  .item-card{
    display:flex; gap:12px; background:var(--card); border:1px solid var(--border);
    border-radius:var(--radius-md); padding:12px;
  }
  .item-card img{width:70px; height:104px; object-fit:cover; border-radius:8px; background:var(--bg-elev); flex-shrink:0;}
  .item-info{flex:1; min-width:0; display:flex; flex-direction:column;}
  .item-info .title{font-weight:700; font-size:.95rem; line-height:1.25;}
  .item-info .meta{font-size:.78rem; color:var(--muted); margin:3px 0 8px 0;}
  .badge{display:inline-block; font-size:.68rem; padding:2px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent); margin-right:4px;}
  .price{font-weight:700; color:var(--accent); font-size:.95rem; margin-top:auto; margin-bottom:8px;}
  .item-info button{
    padding:10px; font-size:.8rem; font-weight:700; border:none; border-radius:var(--radius-sm); cursor:pointer;
  }
  .btn-row{display:flex; gap:8px;}
  .btn-row .btn-ficha{
    flex:1; background:var(--bg-elev); color:var(--text); border:1px solid var(--border) !important;
  }
  .btn-row .btn-wsp{
    flex:1.3; background:linear-gradient(155deg, #25D366, #128C7E); color:#ffffff;
  }

  .status{text-align:center; font-size:.88rem; color:var(--muted); padding:30px 10px;}
  .hidden{display:none !important;}

  .modal-overlay{position:fixed; inset:0; background:rgba(6,6,10,.75); display:flex; align-items:flex-end; justify-content:center; z-index:70;}
  @media (min-width:560px){ .modal-overlay{align-items:center;} }
  .modal-card{
    width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
    background:var(--card); border:1px solid var(--border); border-radius:20px 20px 0 0; padding:20px;
  }
  @media (min-width:560px){ .modal-card{border-radius:var(--radius-lg);} }
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px;}
  .modal-head h2{font-size:1.15rem; margin:0; line-height:1.3;}
  .close-btn{
    flex-shrink:0; width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.1); color:#fff; font-size:1.15rem; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .close-btn:active{background:rgba(255,255,255,.2);}
  .detail-poster{width:130px; height:195px; object-fit:cover; border-radius:var(--radius-md); display:block; margin:0 auto 16px auto; background:var(--bg-elev);}
  .detail-meta{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:14px;}
  .detail-sinopsis{font-size:.9rem; line-height:1.55; color:var(--text); margin-bottom:16px;}
  .detail-label{font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;}
  .video-wrap{position:relative; width:100%; padding-top:56.25%; border-radius:var(--radius-md); overflow:hidden; background:var(--bg-elev); margin-bottom:16px;}
  .video-wrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0;}
  .detail-price{font-size:1.2rem; font-weight:700; color:var(--accent); text-align:center; margin-bottom:16px;}
  .modal-card button.btn-primary{
    width:100%; padding:14px; font-size:.95rem; font-weight:700; border:none; border-radius:var(--radius-sm);
    background:linear-gradient(155deg, #25D366, #128C7E); color:#ffffff; cursor:pointer;
  }
  .fab-scroll{
    position:fixed; right:18px; bottom:28px; z-index:80;
    width:56px; height:56px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(155deg, #a78bda, #8467c4); color:#fff; font-size:1.4rem; font-weight:700;
    box-shadow:0 6px 18px rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transform:translateY(8px); transition:opacity .2s ease, transform .2s ease;
  }
  .fab-scroll.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .item-card img, .item-info .title{cursor:pointer;}
</style>
</head>
<body>

<header class="top">
  <div class="brand-mark">🎬</div>
  <div>
    <h1>PAPITO-PC</h1>
    <p>Catálogo de AudioVisuales</p>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Buscar por título...">
    <div class="chips" id="categoryChips">
      <button class="chip active" data-cat="">Todas</button>
      <button class="chip" data-cat="Película">🎬 Películas</button>
      <button class="chip" data-cat="Serie">📺 Series</button>
      <button class="chip" data-cat="Novela">🌹 Novelas</button>
      <button class="chip" data-cat="Dorama">🇰🇷 Doramas</button>
      <button class="chip" data-cat="Anime">🎌 Animes</button>
      <button class="chip" data-cat="Animado">🧸 Animados</button>
    </div>
    <div class="chips hidden" id="subFilterChips"></div>
  </div>

  <p class="status" id="statusMsg">⏳ Cargando catálogo...</p>
  <div class="grid" id="grid"></div>
</div>

<div class="modal-overlay hidden" id="detailModal">
  <button class="fab-scroll" id="fabScrollBtn" onclick="scrollToOrder()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 10 12 16 18 10"></polyline></svg></button>
  <div class="modal-card" id="modalCard">
    <div class="modal-head">
      <h2 id="detailTitle"></h2>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <img id="detailPoster" class="detail-poster" src="" alt="Póster">
    <div class="detail-meta" id="detailMeta"></div>
    <div id="detailVideoWrap"></div>
    <div class="detail-label">Sinopsis</div>
    <p class="detail-sinopsis" id="detailSinopsis"></p>
    <div class="detail-price" id="detailPrice"></div>
    <button class="btn-primary" id="detailWhatsappBtn"></button>
  </div>
</div>

<script>
/* ============================================================
   Catálogo público — AudioVisuales PAPITO-PC (solo lectura)
   ============================================================ */

// ⚠️ Reemplaza estos dos valores por los de tu proyecto Supabase antes de publicar esta página.
const SUPABASE_URL = 'https://dlilbffqjsdwymdhgbkt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3cTIYHZTg__x4tmwcStC9Q_8Trz1lv9';
const WHATSAPP_NUMBER = '5354343929';

const PLACEHOLDER_POSTER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="185" height="278" viewBox="0 0 185 278"><rect width="185" height="278" fill="#1b1e28"/><text x="50%" y="50%" fill="#8b93a1" font-size="14" text-anchor="middle" dy=".3em" font-family="sans-serif">Sin póster</text></svg>'
);
const ICONS = {
  'Película':'🎬', 'Serie':'📺', 'Novela':'🌹', 'Dorama':'🇰🇷', 'Anime':'🎌', 'Animado':'🧸'
};
const DEFAULT_PRICES = { 'Película':30, 'Serie':20, 'Novela':10, 'Dorama':10, 'Anime':10, 'Animado':5 };
let categoryPrices = Object.assign({}, DEFAULT_PRICES);

function resolvePrecio(item){
  if(item.precio !== null && item.precio !== undefined && item.precio !== '') return item.precio;
  return categoryPrices[item.categoria] ?? DEFAULT_PRICES[item.categoria] ?? 0;
}
const WHATSAPP_ICON = '<svg viewBox="0 0 32 32" width="16" height="16" fill="currentColor" style="vertical-align:-3px; margin-right:5px;"><path d="M16.004 3C9.38 3 4 8.38 4 15.004c0 2.386.65 4.62 1.78 6.536L4 29l7.633-1.744a11.94 11.94 0 0 0 4.371.826h.005C22.63 28.082 28 22.702 28 16.078 28 9.454 22.628 3 16.004 3zm0 22.2h-.004a9.9 9.9 0 0 1-5.045-1.38l-.362-.215-3.77.93 1.007-3.674-.236-.377a9.89 9.89 0 0 1-1.518-5.28c0-5.472 4.454-9.926 9.932-9.926 2.652 0 5.144 1.034 7.02 2.912a9.86 9.86 0 0 1 2.906 7.018c0 5.472-4.454 9.992-9.93 9.992zm5.448-7.44c-.298-.15-1.764-.87-2.038-.97-.273-.1-.472-.15-.67.15-.199.298-.769.97-.943 1.169-.174.198-.348.223-.646.075-.298-.15-1.257-.463-2.394-1.478-.885-.79-1.483-1.765-1.657-2.063-.174-.298-.019-.459.13-.607.134-.133.298-.347.447-.52.15-.174.199-.298.298-.497.1-.199.05-.373-.025-.522-.075-.149-.67-1.615-.918-2.212-.242-.581-.488-.502-.67-.512-.173-.008-.372-.01-.57-.01a1.09 1.09 0 0 0-.795.373c-.273.298-1.043 1.02-1.043 2.487 0 1.467 1.068 2.884 1.217 3.083.149.198 2.098 3.205 5.083 4.494.71.307 1.264.49 1.696.627.712.226 1.362.194 1.875.118.572-.085 1.764-.72 2.013-1.417.248-.696.248-1.293.174-1.417-.075-.124-.273-.198-.571-.348z"/></svg>';

let allItems = [];
let fabObserver = null;
let modalOpenViaHistory = false;
let activeCategory = '';
let activeSubFilter = '';
let supabaseClient = null;

const GENRE_CATEGORIES = ['Película', 'Serie', 'Anime', 'Animado'];
const COUNTRY_CATEGORIES = ['Novela', 'Dorama'];

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadCatalog(){
  const statusEl = document.getElementById('statusMsg');
  if(SUPABASE_URL.indexOf('TU_SUPABASE') === 0){
    statusEl.textContent = '⚠️ Esta página aún no está configurada. Falta pegar la URL y la clave de Supabase en el código.';
    return;
  }
  try{
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const pricesRes = await supabaseClient.from('settings').select('value').eq('key','precios').limit(1);
    if(!pricesRes.error && pricesRes.data && pricesRes.data.length && pricesRes.data[0].value){
      categoryPrices = Object.assign({}, DEFAULT_PRICES, pricesRes.data[0].value);
    }

    const { data, error } = await supabaseClient.from('content').select('*').order('titulo', { ascending:true });
    if(error) throw error;
    allItems = data || [];
    if(allItems.length === 0){
      statusEl.textContent = 'Aún no hay contenido publicado.';
      return;
    }
    statusEl.classList.add('hidden');
    render();
  }catch(e){
    console.error(e);
    statusEl.textContent = `❌ No se pudo cargar el catálogo. (${e.message || e})`;
  }
}

function splitField(value){
  return (value || '').split(',').map(s => s.trim()).filter(Boolean);
}

function buildSubFilterChips(){
  const wrap = document.getElementById('subFilterChips');
  wrap.innerHTML = '';

  if(!GENRE_CATEGORIES.includes(activeCategory) && !COUNTRY_CATEGORIES.includes(activeCategory)){
    wrap.classList.add('hidden');
    return;
  }

  const byCategory = allItems.filter(item => item.categoria === activeCategory);
  const field = GENRE_CATEGORIES.includes(activeCategory) ? 'genero' : 'pais';
  const values = new Set();
  byCategory.forEach(item => splitField(item[field]).forEach(v => values.add(v)));

  if(values.size === 0){
    wrap.classList.add('hidden');
    return;
  }

  wrap.classList.remove('hidden');
  const allBtn = document.createElement('button');
  allBtn.className = 'chip' + (activeSubFilter === '' ? ' active' : '');
  allBtn.textContent = 'Todos';
  allBtn.dataset.val = '';
  wrap.appendChild(allBtn);

  [...values].sort().forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (activeSubFilter === v ? ' active' : '');
    btn.textContent = v;
    btn.dataset.val = v;
    wrap.appendChild(btn);
  });
}

function render(){
  const grid = document.getElementById('grid');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const subField = GENRE_CATEGORIES.includes(activeCategory) ? 'genero' : 'pais';
  const filtered = allItems.filter(item => {
    const matchesCategory = !activeCategory || item.categoria === activeCategory;
    const matchesQuery = !query || (item.titulo || '').toLowerCase().includes(query);
    const matchesSubFilter = !activeSubFilter || splitField(item[subField]).includes(activeSubFilter);
    return matchesCategory && matchesQuery && matchesSubFilter;
  });

  grid.innerHTML = '';
  const statusEl = document.getElementById('statusMsg');
  if(filtered.length === 0){
    statusEl.textContent = 'No hay resultados con ese filtro.';
    statusEl.classList.remove('hidden');
    return;
  }
  statusEl.classList.add('hidden');

  filtered.forEach(item => {
    const poster = item.poster || PLACEHOLDER_POSTER;
    const icon = ICONS[item.categoria] || '🎬';
    const div = document.createElement('div');
    div.className = 'item-card';
    div.innerHTML = `
      <img src="${poster}" alt="Póster">
      <div class="item-info">
        <div class="title">${escapeHtml(item.titulo)}</div>
        <div class="meta"><span class="badge">${icon} ${escapeHtml(item.categoria)}</span>${escapeHtml(item.anio)}</div>
        <div class="price">${resolvePrecio(item)} CUP</div>
        <div class="btn-row">
          <button class="btn-ficha">🎬 Ver ficha</button>
          <button class="btn-wsp">${WHATSAPP_ICON}Pedir</button>
        </div>
      </div>
    `;
    div.querySelector('img').addEventListener('click', () => openDetail(item));
    div.querySelector('.title').addEventListener('click', () => openDetail(item));
    div.querySelector('.btn-ficha').addEventListener('click', () => openDetail(item));
    div.querySelector('.btn-wsp').addEventListener('click', () => pedirPorWhatsapp(item));
    grid.appendChild(div);
  });
}

function extractYoutubeId(url){
  if(!url) return null;
  const patterns = [
    /youtu\.be\/([A-Za-z0-9_-]{6,})/,
    /[?&]v=([A-Za-z0-9_-]{6,})/,
    /youtube\.com\/embed\/([A-Za-z0-9_-]{6,})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return null;
}

function openDetail(item){
  document.getElementById('detailTitle').textContent = item.titulo;
  document.getElementById('detailPoster').src = item.poster || PLACEHOLDER_POSTER;

  const icon = ICONS[item.categoria] || '🎬';
  const metaEl = document.getElementById('detailMeta');
  metaEl.innerHTML = '';
  [`${icon} ${item.categoria}`, item.anio, item.pais, item.genero, item.formato, item.idioma]
    .filter(Boolean)
    .forEach(text => {
      const span = document.createElement('span');
      span.className = 'badge';
      span.textContent = text;
      metaEl.appendChild(span);
    });

  document.getElementById('detailSinopsis').textContent = item.sinopsis || 'Sin sinopsis disponible.';
  document.getElementById('detailPrice').textContent = `${resolvePrecio(item)} CUP`;

  const videoWrap = document.getElementById('detailVideoWrap');
  const videoId = extractYoutubeId(item.trailer);
  if(videoId){
    videoWrap.innerHTML = `<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${videoId}" title="Tráiler" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  }else{
    videoWrap.innerHTML = '';
  }

  document.getElementById('detailWhatsappBtn').innerHTML = WHATSAPP_ICON + 'Pedir por WhatsApp';
  document.getElementById('detailWhatsappBtn').onclick = () => pedirPorWhatsapp(item);
  document.getElementById('detailModal').classList.remove('hidden');

  if(!modalOpenViaHistory){
    history.pushState({ papitoModal:true }, '', location.href);
    modalOpenViaHistory = true;
  }

  const fab = document.getElementById('fabScrollBtn');
  fab.classList.add('show');
  const target = document.getElementById('detailWhatsappBtn');
  if(fabObserver) fabObserver.disconnect();
  fabObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => fab.classList.toggle('show', !entry.isIntersecting));
  }, { root: document.getElementById('modalCard'), threshold: 0.9 });
  fabObserver.observe(target);
}
function scrollToOrder(){
  const target = document.getElementById('detailWhatsappBtn');
  target.scrollIntoView({ behavior:'smooth', block:'center' });
}
function closeDetail(fromPopstate){
  document.getElementById('detailModal').classList.add('hidden');
  document.getElementById('detailVideoWrap').innerHTML = ''; // detiene el video al cerrar
  document.getElementById('fabScrollBtn').classList.remove('show');
  if(fabObserver){ fabObserver.disconnect(); fabObserver = null; }
  if(modalOpenViaHistory){
    modalOpenViaHistory = false;
    if(!fromPopstate) history.back(); // consume el estado que empujamos, sin salir de la página
  }
}
window.addEventListener('popstate', () => {
  if(modalOpenViaHistory) closeDetail(true);
});
document.getElementById('detailModal').addEventListener('click', e => {
  if(e.target.id === 'detailModal') closeDetail();
});

function pedirPorWhatsapp(item){
  const texto = `Hola, quiero pedir:\n${item.titulo} (${item.anio}) — ${item.categoria}\nPrecio: ${resolvePrecio(item)} CUP`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(texto)}`;
  window.location.href = url;
}

document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('categoryChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('#categoryChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  activeSubFilter = '';
  buildSubFilterChips();
  render();
});
document.getElementById('subFilterChips').addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if(!btn) return;
  document.querySelectorAll('#subFilterChips .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  activeSubFilter = btn.dataset.val;
  render();
});

loadCatalog();
</script>
</body>
</html>
