<script>
/* ============================================================
   Catálogo público — AudioVisuales PAPITO-PC (solo lectura)
   ============================================================ */

// ⚠️ Reemplaza estos dos valores por los de tu proyecto Supabase antes de publicar esta página.
const SUPABASE_URL = 'https://dlilbffqjsdwymdhgbkt.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_3cTIYHZTg__x4tmwcStC9Q_8Trz1lv9';
const WHATSAPP_NUMBER = '5354343929';

const PLACEHOLDER_POSTER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="185" height="278" viewBox="0 0 185 278"><rect width="185" height="278" fill="#1b1e28"/><text x="50%" y="50%" fill="#8b93a1" font-size="14" text-anchor="middle" dy=".3em" font-family="sans-serif">Sin póster</text></svg>'
);
const ICONS = {
  'Película':'🎬', 'Serie':'📺', 'Novela':'🌹', 'Dorama':'🇰🇷', 'Anime':'🎌', 'Animado':'🧸'
};
const DEFAULT_PRICES = { 'Película':30, 'Serie':20, 'Novela':10, 'Dorama':10, 'Anime':10, 'Animado':5 };
let categoryPrices = Object.assign({}, DEFAULT_PRICES);

// Un Dorama se guarda como categoria='Serie' + es_dorama=true (siempre pertenece también a Series).
function itemInCategory(item, cat){
  if(cat === 'Dorama') return item.categoria === 'Serie' && !!item.es_dorama;
  return item.categoria === cat;
}
function displayCategoria(item){
  return (item.categoria === 'Serie' && item.es_dorama) ? 'Dorama' : item.categoria;
}
function resolvePrecio(item){
  if(item.precio !== null && item.precio !== undefined && item.precio !== '') return item.precio;
  const cat = displayCategoria(item);
